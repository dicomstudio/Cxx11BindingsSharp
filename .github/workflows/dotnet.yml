# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Google Test
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - name: CMake configure
        run: cmake -S native -B build
      - name: CMake build
        run: cmake --build build --config Release
      - name: CMake install
        run: cmake --install build --prefix target/x86_64-unknown-linux-gnu
      - name: upload Cxx11Bindings.so
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}
          path: target/x86_64-unknown-linux-gnu
          retention-days: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x
      - name: Restore dependencies
        run: dotnet restore -p:TargetFramework=net6.0
      - name: Build
        run: dotnet build -p:TargetFramework=net6.0 --no-restore
      - name: Manual copy
        run: cp target/x86_64-unknown-linux-gnu/lib/Cxx11Bindings.so tests/Cxx11BindingsSharp.Tests/bin/Debug/net6.0/
      - name: Test
        run: dotnet test --no-build --verbosity normal

  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0'
      - name: CMake configure
        run: cmake -S native -B build -DCMAKE_TOOLCHAIN_FILE=${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: CMake build
        run: cmake --build build --config Release
      - name: CMake install
        run: cmake --install build --prefix target/x86_64-pc-windows-msvc
      - name: upload Cxx11Bindings.dll
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}
          path: target/x86_64-pc-windows-msvc
          retention-days: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Remove native Cxx11Bindings.vcxproj
        run: rm native/Cxx11Bindings.vcxproj
      - name: Build
        run: dotnet build --no-restore
      - name: Manual copy
        run: |
          cp target/x86_64-pc-windows-msvc/lib/Cxx11Bindings.dll tests/Cxx11BindingsSharp.Tests/bin/Debug/net6.0/
          cp target/x86_64-pc-windows-msvc/lib/Cxx11Bindings.dll tests/Cxx11BindingsSharp.Tests/bin/Debug/net8.0/
      - name: Test
        run: dotnet test --no-build --verbosity normal

  fake-pack:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: [ linux-amd64, windows-amd64 ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          path: target
      - name: dump content
        run: find target
      - name: Nuget pack
        run: dotnet pack -p:Version=0.0.0 --configuration Release

  publish-github-nuget:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    needs: [ linux-amd64, windows-amd64 ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          path: target
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Nuget pack
        run: dotnet pack -p:Version=${{ env.VERSION }} --configuration Release --include-symbols --include-source
      - name: Add GitHub NuGet source
        run: dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
      - name: Push NuGet package
        run: dotnet nuget push "src/Cxx11BindingsSharp/bin/Release/*.nupkg" --source "github"
      - name: Push NuGet package to nuget.org
        run: dotnet nuget push "src/Cxx11BindingsSharp/bin/Release/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
      - name: Push NuGet source package to nuget.org
        run: dotnet nuget push "src/Cxx11BindingsSharp/bin/Release/*.snupkg" --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
