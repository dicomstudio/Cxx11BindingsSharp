# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Google Test
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - name: CMake configure
        run: cmake -S native -B build
      - name: CMake build
        run: cmake --build build --config Release
      - name: CMake install
        run: cmake --install build --prefix target/x86_64-unknown-linux-gnu
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x
      - name: Restore dependencies
        run: dotnet restore -p:TargetFramework=net6.0
      - name: Build
        run: dotnet build -p:TargetFramework=net6.0 --no-restore
      - name: Manual copy
        run: cp build/lib/Cxx11BindingsTests.so tests/Cxx11BindingsSharp.Tests/bin/Debug/net6.0/
      - name: Test
        run: dotnet test --no-build --verbosity normal

  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0'
      - name: CMake configure
        run: cmake -S native -B build -DCMAKE_TOOLCHAIN_FILE=${{ runner.workspace }}/b/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: CMake build
        run: cmake --build build --config Release
      - name: CMake install
        run: cmake --install build --prefix target/x86_64-pc-windows-msvc
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Remove native Cxx11BindingsTests.vcxproj
        run: rm native/Cxx11BindingsTests.vcxproj
      - name: Build
        run: dotnet build --no-restore
      - name: Manual copy
        run: |
          cp build/lib/Release/Cxx11BindingsTests.dll tests/Cxx11BindingsSharp.Tests/bin/Debug/net48/
          cp build/lib/Release/Cxx11BindingsTests.dll tests/Cxx11BindingsSharp.Tests/bin/Debug/net6.0/
          cp build/lib/Release/Cxx11BindingsTests.dll tests/Cxx11BindingsSharp.Tests/bin/Debug/net8.0/
      - name: Test
        run: dotnet test --no-build --verbosity normal

  fake-pack:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    needs: [ linux-amd64, windows-amd64 ]
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Nuget SDK info
        run: dotnet --list-sdks
      - name: Nuget pack
        run: dotnet pack -p:Version=0.0.0 --configuration Release

# For NuGet packages, the version follows [Semantic Versioning (SemVer)](https://semver.org/). The typical format is:
#
# ```
# MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]
# ```
#
# - **MAJOR**: Breaking changes
# - **MINOR**: Backwards-compatible feature additions
# - **PATCH**: Backwards-compatible bug fixes
# - **PRERELEASE**: Optional, for pre-release versions (e.g., `-beta`, `-rc.1`)
# - **BUILD**: Optional, for build metadata
#
# NuGet enforces and interprets these semantics for dependency resolution and package updates.
  publish-github-nuget:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      packages: write
    needs: [ linux-amd64, windows-amd64 ]
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Extract version from tag
        run: echo "VERSION=$($env:GITHUB_REF -replace '^refs/tags/v','')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Nuget SDK info
        run: dotnet --list-sdks
      - name: Nuget pack
        run: dotnet pack -p:Version=${{ env.VERSION }} --configuration Release --include-symbols --include-source
      - name: Add GitHub NuGet source
        run: dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
      - name: Push NuGet package
        run: dotnet nuget push "src/Cxx11BindingsSharp/bin/Release/*.nupkg" --source "github"
      - name: Push NuGet package to nuget.org
        run: dotnet nuget push "src/Cxx11BindingsSharp/bin/Release/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
